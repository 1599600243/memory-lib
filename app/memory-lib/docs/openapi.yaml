        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error:
                type: object
                properties:
                  code: { type: string, example: FORBIDDEN }
                  message: { type: string }
                  detail: { type: string, example: SCOPE_DENIED }
    NotFound:
      description: 资源不存在（不泄漏存在性）
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error:
                type: object
                properties:
                  code: { type: string, example: NOT_FOUND }
                  message: { type: string }
    IssuedKey:
      description: 角色 key 已签发；明文 secret 仅在该响应出现一次
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IssuedKeyResponse" }
    BadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: false }
              error:
                type: object
                properties:
                  code: { type: string, example: BAD_REQUEST }
                  message: { type: string }
  requestBodies:

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆库宠物</title>
<style>
:root{--ink:#17324b;--muted:#668096;--line:#c9dfe7;--blue:#287fae;--gold:#efb94f;--glass:#f8fcfddd}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:transparent}button,input{font:inherit}.desktop{position:relative;width:100%;height:100%;background:transparent;user-select:none}.stage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.pet-button{position:relative;width:190px;height:250px;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;filter:drop-shadow(0 15px 9px #17324b32);transition:transform .2s}.pet-button:hover{transform:translateY(-4px) scale(1.02)}.pet-button:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:50%}.pet-image{width:100%;height:100%;object-fit:contain;pointer-events:none}.pet-css{position:absolute;inset:0;margin:auto;width:142px;height:172px}.pet-css .body{position:absolute;bottom:12px;left:14px;width:114px;height:120px;background:linear-gradient(145deg,#91d8f2,#4396c3);border:4px solid #27799f;border-radius:52% 52% 46% 46%}.pet-css .ear{position:absolute;top:25px;width:36px;height:52px;background:#55a9d1;border:4px solid #27799f;border-radius:70% 30% 60% 35%;z-index:2}.pet-css .ear.l{left:17px;transform:rotate(-25deg)}.pet-css .ear.r{right:17px;transform:scaleX(-1) rotate(-25deg)}.pet-css .eye{position:absolute;top:75px;width:10px;height:14px;background:var(--ink);border-radius:50%;z-index:3}.pet-css .eye.l{left:48px}.pet-css .eye.r{right:48px}.pet-css .mouth{position:absolute;z-index:3;left:61px;top:101px;width:20px;height:10px;border-bottom:3px solid var(--ink);border-radius:0 0 18px 18px}.pet-css .badge{position:absolute;z-index:4;right:2px;bottom:24px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--gold);border:3px solid #fff;font-size:17px}.pet-button.idle .pet-css{animation:float 3s ease-in-out infinite}.pet-button.thinking .eye{animation:look 1s infinite alternate}.pet-button.talking .mouth{width:14px;height:14px;left:64px;background:var(--ink);border:0;border-radius:50%;animation:talk .28s infinite alternate}.pet-button.happy{transform:scale(1.05) translateY(-6px)}.pet-button.happy .eye{height:7px;border-radius:10px 10px 0 0;background:transparent;border-top:3px solid var(--ink)}.pet-button.alert .badge{animation:ring .8s infinite}.pet-button.alert{animation:shake .25s 3}@keyframes float{50%{transform:translateY(-7px)}}@keyframes look{to{transform:translateX(8px)}}@keyframes talk{to{transform:scaleY(.55)}}@keyframes ring{50%{transform:rotate(15deg) scale(1.15)}}@keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.bubble{position:absolute;left:50%;bottom:calc(50% + 126px);transform:translateX(-50%);max-width:260px;padding:10px 13px;background:#fff;border:1px solid var(--line);border-radius:14px 14px 4px 14px;box-shadow:0 8px 22px #17324b20;white-space:pre-wrap;overflow-wrap:anywhere;transition:opacity .25s,transform .25s;pointer-events:none}.bubble:after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}.bubble.hidden{opacity:0;transform:translate(-50%,8px)}
.panel,.auth{position:absolute;left:50%;bottom:18px;width:min(390px,calc(100% - 24px));transform:translateX(-50%);padding:12px;background:var(--glass);border:1px solid #c2dce5;border-radius:12px;box-shadow:0 14px 40px #17324b30;backdrop-filter:blur(12px);user-select:text}.panel[hidden]{display:none}.toolbar,.row,.auth-actions{display:flex;gap:6px}.toolbar{margin-bottom:8px;align-items:center}.toolbar button,.chips button,.send,.auth-actions button{border:0;border-radius:7px;background:#dcecf0;color:var(--ink);padding:6px 8px;cursor:pointer}.toolbar button.active{background:var(--blue);color:#fff}.toolbar button:last-child{margin-left:auto}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.chips button{font-size:11px;padding:5px 8px}.row input,.auth input,.auth select{min-width:0;flex:1;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff;color:var(--ink)}.send{background:var(--blue);color:#fff;font-weight:700;min-width:52px}.chat{height:98px;overflow:auto;margin-bottom:8px}.msg{padding:7px 10px;margin:4px 0;max-width:90%;border-radius:9px;background:#e5f1f3;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{margin-left:auto;background:var(--blue);color:#fff}.msg.err{color:#b34e58;background:#fff0f0}.auth{display:none;left:auto;right:12px;bottom:12px;width:300px;transform:none}.panel .auth{display:block;position:static;width:auto;padding:0;margin-bottom:8px;background:transparent;border:0;box-shadow:none;backdrop-filter:none}.auth summary{cursor:pointer;color:var(--blue);font-size:12px}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.auth-grid input,.auth-grid select{width:100%;font-size:11px}.context-menu{position:fixed;z-index:5;min-width:170px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px #17324b35}.context-menu[hidden]{display:none}.context-menu button{display:block;width:100%;padding:8px 10px;border:0;border-radius:5px;text-align:left;background:transparent;color:var(--ink);cursor:pointer}.context-menu button:hover{background:#e8f3f5}.menu-separator{height:1px;margin:4px 0;background:var(--line)}
</style>
</head>
<body><main class="desktop" id="desktop"><section class="stage" aria-label="桌面宠物"><button class="pet-button idle" id="pet" title="点击展开对话，右键打开菜单" aria-label="桌面宠物"><img class="pet-image" id="petImage" alt=""><span class="pet-css" id="petCss" aria-hidden="true"><i class="ear l"></i><i class="ear r"></i><i class="body"></i><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i><i class="badge">✦</i></span></button></section><div class="bubble" id="bubble">你好呀！</div>
<section class="panel" id="panel" hidden><details class="auth"><summary>连接设置（凭证仅存于本页内存）</summary><div class="auth-grid"><input id="cred" value="memory-lib/deepseek-harness" placeholder="credential_ref"><input id="secret" type="password" placeholder="secret"><select id="agent"><option>pilot-01</option><option>admin-01</option></select><select id="role"><option value="pet">pet 宠物</option><option value="pet-companion">pet-companion 陪伴</option><option value="pet-assistant">pet-assistant 普通</option><option value="pet-steward">pet-steward 管家</option><option value="pet-learner">pet-learner 学习</option><option value="learner">learner 学习（兼容）</option><option value="researcher">researcher 研究（兼容）</option></select></div></details><div class="toolbar" id="modes"><button data-mode="companion" class="active">陪伴</button><button data-mode="assistant">普通</button><button data-mode="steward">管家</button><button data-mode="learner">学习</button><button data-mode="governance">治理</button><button id="connect">连接</button></div><div class="chips"><button data-cmd="/learn:topic ">学习地图</button><button data-cmd="/learn:status ">学习进度</button><button data-cmd="/learn:review ">复习</button><button data-cmd="/help">帮助</button></div><div class="chat" id="chat"></div><div class="row"><input id="input" placeholder="输入消息或 /命令" autocomplete="off"><button class="send" id="send">发送</button></div></section>
<nav class="context-menu" id="contextMenu" hidden aria-label="宠物菜单"><button data-action="toggle-panel">展开/收起对话</button><button data-action="mode">切换模式</button><button data-action="state">切换状态</button><button data-action="clear">清空历史</button><div class="menu-separator"></div><button data-action="exit">退出宠物</button></nav></main>
<script>
"use strict";
const $=id=>document.getElementById(id),S={mode:"companion",busy:false,history:[],state:"idle",manifest:null};
function add(role,text){const e=document.createElement("div");e.className="msg "+role;e.textContent=text;$("chat").append(e);$("chat").scrollTop=$("chat").scrollHeight}
function state(name,label){S.state=name;$("pet").className="pet-button "+name;$("bubble").dataset.state=label}
let bubbleTimer;function bubble(text,sticky=false){const e=$("bubble");e.textContent=text;e.classList.remove("hidden");clearTimeout(bubbleTimer);if(!sticky)bubbleTimer=setTimeout(()=>e.classList.add("hidden"),4500)}
function togglePanel(force){$("panel").hidden=force===undefined?!$("panel").hidden:!force;if(!$("panel").hidden){$("input").focus();bubble("对话面板已打开")}}
function assetUrl(path){return new URL(path,document.baseURI).href}
function renderManifest(manifest){S.manifest=manifest||{};const sprite=S.manifest.sprite||{};const image=S.manifest.image;const imageStates=sprite.states&&typeof sprite.states==="object"?sprite.states:null;const path=image?.idle||image||imageStates?.idle;if(path){$("petImage").src=assetUrl(path.startsWith("characters/")?path:`characters/${S.manifest.id||"generated-companion"}/${path}`);$("petCss").hidden=true}else{$("petImage").hidden=true}}
async function loadCharacter(id="generated-companion"){try{const r=await fetch(`characters/${encodeURIComponent(id)}/character.json`);if(!r.ok)throw new Error("character manifest unavailable");renderManifest(await r.json())}catch(_){renderManifest({id:"generated-companion",renderer:"css-sprite"})}}
async function send(text){text=String(text||"").trim();if(!text||S.busy)return;const secret=document.getElementById("secret").value;if(!secret){bubble("请先在连接设置中填写 secret。",true);document.querySelector(".auth").open=true;return}S.busy=true;add("user",text);state("thinking","思考");bubble("让我想想…",true);try{const r=await fetch("/v1/pet/command",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({credential_ref:$("cred").value.trim(),secret,principal:{agent_id:$("agent").value,role_id:$("role").value},input:text,mode:S.mode,history:S.history.slice(-8)})});const d=await r.json().catch(()=>({}));if(r.ok){const reply=d.reply||"（无回复）";add("pet",reply);bubble(reply);S.history.push({role:"user",content:text},{role:"assistant",content:reply});state("talking","说话");setTimeout(()=>state("idle","待机"),1200)}else{add("err","请求失败（"+r.status+"）："+(d.error?.message||d.error?.code||"未知错误"));state("alert","提醒");bubble("连接出现问题，请检查服务和凭证。",true)}}catch(e){add("err","网络错误："+e.message);state("alert","提醒");bubble("暂时无法连接核心服务。",true)}finally{S.busy=false}}
document.querySelectorAll("#modes button[data-mode]").forEach(b=>b.onclick=()=>{document.querySelectorAll("#modes button[data-mode]").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.mode=b.dataset.mode;state("happy","模式切换");bubble(`已切换到${b.textContent}模式`);setTimeout(()=>state("idle","待机"),700)});document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>{$("input").value=b.dataset.cmd;$("input").focus()});$("send").onclick=()=>{const i=$("input");send(i.value);i.value=""};$("input").onkeydown=e=>{if(e.key==="Enter")$("send").click()};$("connect").onclick=()=>send("/help");$("pet").onclick=()=>togglePanel();
const menu=$("contextMenu");$("desktop").oncontextmenu=e=>{e.preventDefault();menu.hidden=false;menu.style.left=Math.min(e.clientX,innerWidth-185)+"px";menu.style.top=Math.min(e.clientY,innerHeight-210)+"px"};document.addEventListener("click",e=>{if(!menu.contains(e.target))menu.hidden=true});menu.onclick=e=>{const action=e.target.dataset.action;if(!action)return;menu.hidden=true;if(action==="toggle-panel")togglePanel();if(action==="mode"){const modes=["companion","assistant","steward","learner","governance"];const next=modes[(modes.indexOf(S.mode)+1)%modes.length];document.querySelector(`#modes [data-mode="${next}"]`).click()}if(action==="state"){const states=["idle","thinking","happy","alert"];state(states[(states.indexOf(S.state)+1)%states.length],"状态切换");bubble("状态已切换")}if(action==="clear"){$("chat").replaceChildren();S.history=[];bubble("历史已清空")}if(action==="exit")window.__TAURI__?.window?.getCurrentWindow?.().close()};
loadCharacter();add("pet","桌面宠物已就绪。核心服务仍通过 /v1/pet/command 提供能力。");
</script></body></html>
